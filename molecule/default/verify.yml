---
# =============================================================================
# Ansible Role: Users - Molecule Verification Playbook
# =============================================================================
# This playbook verifies the installation and configuration of users.
# It performs comprehensive checks of:
# - User creation
# - Group membership
# - Password configuration
# - SSH key setup
# - Home directory creation and permissions
# - User removal
# - Password expiry
# - Sudoers drop-in file generation, content, permissions, purge, and validation
#
# Flow:
# 1. Load variables and gather facts
# 2. Verify user creation and attributes
# 3. Check group memberships
# 4. Validate SSH key configuration
# 5. Check home directories
# 6. Verify user removal
# 7. Verify password expiry
# 8. Verify sudoers drop-in files
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Environment Setup
# -----------------------------------------------------------------------------
- name: Molecule | Verify Role
  hosts: all
  gather_facts: true

  vars_files:
    - ../../defaults/main.yml

  tasks:
    # -----------------------------------------------------------------------------
    # 2. User Creation and Attributes Verification
    # -----------------------------------------------------------------------------
    - name: Verify | Check if users exist
      ansible.builtin.getent:
        database: passwd
        key: "{{ item }}"
      register: _user_exists_result_
      with_items:
        - testuser1
        - testuser2
        - testuser3
      ignore_errors: true

    - name: Verify | Check if testuser1 has correct UID
      ansible.builtin.command: id -u testuser1
      register: _uid_result_
      changed_when: false
      ignore_errors: true

    - name: Verify | Check if testuser2 is a system user
      ansible.builtin.getent:
        database: passwd
        key: testuser2
      register: _system_user_result_
      changed_when: false
      ignore_errors: true

    - name: Verify | Check if users have correct shells
      ansible.builtin.getent:
        database: passwd
        key: "{{ item.user }}"
      register: _shell_result_
      with_items:
        - { user: 'testuser1', expected: '/bin/bash' }
        - { user: 'testuser2', expected: '/bin/false' }
        - { user: 'testuser3', expected: '/bin/bash' }
      changed_when: false
      ignore_errors: true

    # -----------------------------------------------------------------------------
    # 3. Group Membership Verification
    # -----------------------------------------------------------------------------
    - name: Verify | Check if users are in correct groups
      ansible.builtin.command: id -Gn {{ item.user }}
      register: _group_result_
      with_items:
        - { user: 'testuser1', group: 'developers' }
        - { user: 'testuser1', group: 'testgroup' }
        - { user: 'testuser3', group: 'testgroup' }
      changed_when: false
      ignore_errors: true

    # -----------------------------------------------------------------------------
    # 4. SSH Key Configuration Verification
    # -----------------------------------------------------------------------------
    - name: Verify | Check if SSH key directories exist
      ansible.builtin.stat:
        path: "/home/testuser1/.ssh"
      register: _ssh_dir_result_
      ignore_errors: true

    - name: Verify | Check if authorized_keys files exist
      ansible.builtin.stat:
        path: "/home/testuser1/.ssh/authorized_keys"
      register: _auth_keys_result_
      ignore_errors: true

    - name: Verify | Check authorized_keys content for testuser1
      ansible.builtin.command: grep -q molecule-test-key /home/testuser1/.ssh/authorized_keys
      register: _auth_keys_content_result_
      changed_when: false
      ignore_errors: true

    # -----------------------------------------------------------------------------
    # 5. Home Directory Verification
    # -----------------------------------------------------------------------------
    - name: Verify | Check if home directories exist with correct ownership
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: _home_dir_result_
      with_items:
        - { path: '/home/testuser1', owner: 'testuser1' }
        - { path: '/opt/testuser2', owner: 'testuser2' }
        - { path: '/home/testuser3', owner: 'testuser3' }
      ignore_errors: true

    - name: Verify | Check home directory permissions for testuser1
      ansible.builtin.command: ls -ld /home/testuser1
      register: _home_perms_result_
      changed_when: false
      ignore_errors: true

    # -----------------------------------------------------------------------------
    # 6. User Removal Verification
    # -----------------------------------------------------------------------------
    - name: Verify | Check if removed user no longer exists
      ansible.builtin.command: id testuser_remove
      register: _removed_user_result_
      failed_when: false
      changed_when: false

    - name: Verify | Assert removed user no longer exists
      ansible.builtin.assert:
        that:
          - _removed_user_result_.rc != 0
        fail_msg: "❌ User testuser_remove still exists on the system"
        success_msg: "✅ User testuser_remove has been successfully removed"

    - name: Verify | Check if home directory of removed user no longer exists
      ansible.builtin.stat:
        path: "/home/testuser_remove"
      register: _removed_home_result_
      failed_when: _removed_home_result_.stat.exists | default(false)

    # -----------------------------------------------------------------------------
    # 7. Password Expiry Verification
    # -----------------------------------------------------------------------------
    - name: Verify | Check if password expiry is set correctly for testuser3
      ansible.builtin.command: chage -l testuser3
      register: _passwd_max_age_result_
      changed_when: false
      ignore_errors: true

    - name: Verify | Check if password minimum age is set correctly for testuser3
      ansible.builtin.command: chage -l testuser3
      register: _passwd_min_age_result_
      changed_when: false
      ignore_errors: true

    # -----------------------------------------------------------------------------
    # 8. Sudoers Drop-In Verification
    # -----------------------------------------------------------------------------
    - name: Verify | Stat testuser1 sudoers drop-in file
      ansible.builtin.stat:
        path: /etc/sudoers.d/testuser1
      register: __verify_sudoers_testuser1

    - name: Verify | Assert testuser1 sudoers drop-in exists with 0440 permissions
      ansible.builtin.assert:
        that:
          - __verify_sudoers_testuser1.stat.exists
          - __verify_sudoers_testuser1.stat.mode == '0440'
          - __verify_sudoers_testuser1.stat.pw_name == 'root'
        fail_msg: "testuser1 sudoers drop-in file missing or has invalid permissions/ownership"
        success_msg: "testuser1 sudoers drop-in file verified (mode 0440, owner root)"

    - name: Verify | Read testuser1 sudoers file content
      ansible.builtin.slurp:
        src: /etc/sudoers.d/testuser1
      register: __verify_sudoers_testuser1_content

    - name: Verify | Assert testuser1 sudoers file contains default rule
      ansible.builtin.assert:
        that:
          - "'testuser1 ALL=(ALL) NOPASSWD:ALL' in (__verify_sudoers_testuser1_content.content | b64decode)"
        fail_msg: "testuser1 sudoers file does not contain expected default rule"
        success_msg: "testuser1 sudoers file contains 'testuser1 ALL=(ALL) NOPASSWD:ALL'"

    - name: Verify | Stat testuser2 sudoers drop-in file
      ansible.builtin.stat:
        path: /etc/sudoers.d/testuser2
      register: __verify_sudoers_testuser2

    - name: Verify | Assert testuser2 sudoers drop-in exists with 0440 permissions
      ansible.builtin.assert:
        that:
          - __verify_sudoers_testuser2.stat.exists
          - __verify_sudoers_testuser2.stat.mode == '0440'
          - __verify_sudoers_testuser2.stat.pw_name == 'root'
        fail_msg: "testuser2 sudoers drop-in file missing or has invalid permissions/ownership"
        success_msg: "testuser2 sudoers drop-in file verified (mode 0440, owner root)"

    - name: Verify | Read testuser2 sudoers file content
      ansible.builtin.slurp:
        src: /etc/sudoers.d/testuser2
      register: __verify_sudoers_testuser2_content

    - name: Verify | Assert testuser2 sudoers file contains custom rules and defaults
      ansible.builtin.assert:
        that:
          - "'# Restricted service lifecycle management' in (__verify_sudoers_testuser2_content.content | b64decode)"
          - "'Defaults:testuser2 !requiretty' in (__verify_sudoers_testuser2_content.content | b64decode)"
          - "'testuser2 ALL=(root) NOPASSWD: /usr/bin/systemctl restart nginx' in (__verify_sudoers_testuser2_content.content | b64decode)"
          - "'testuser2 ALL=(root) NOPASSWD: /usr/bin/systemctl status nginx' in (__verify_sudoers_testuser2_content.content | b64decode)"
        fail_msg: "testuser2 sudoers file does not contain expected custom rules, defaults, or comment"
        success_msg: "testuser2 sudoers file custom rules, defaults, and comment verified"

    - name: Verify | Stat purged testuser3 sudoers drop-in file
      ansible.builtin.stat:
        path: /etc/sudoers.d/testuser3
      register: __verify_sudoers_testuser3

    - name: Verify | Assert testuser3 sudoers drop-in was purged
      ansible.builtin.assert:
        that:
          - not __verify_sudoers_testuser3.stat.exists
        fail_msg: "testuser3 sudoers drop-in was not purged when disabled"
        success_msg: "testuser3 sudoers drop-in successfully purged"

    - name: Verify | Stat removed testuser_remove sudoers drop-in file
      ansible.builtin.stat:
        path: /etc/sudoers.d/testuser_remove
      register: __verify_sudoers_testuser_remove

    - name: Verify | Assert testuser_remove sudoers drop-in was deleted
      ansible.builtin.assert:
        that:
          - not __verify_sudoers_testuser_remove.stat.exists
        fail_msg: "testuser_remove sudoers drop-in was not deleted on user removal"
        success_msg: "testuser_remove sudoers drop-in successfully deleted"

    - name: Verify | Run visudo syntax validation
      ansible.builtin.command: visudo -c
      register: __verify_visudo
      changed_when: false

    - name: Verify | Assert visudo syntax validation passed
      ansible.builtin.assert:
        that:
          - __verify_visudo.rc == 0
        fail_msg: "visudo syntax validation failed"
        success_msg: "visudo syntax validation passed successfully (rc=0)"

    - name: Verify | Check sudo permissions for testuser1
      ansible.builtin.command: sudo -l -U testuser1
      register: __verify_sudo_list_testuser1
      changed_when: false

    - name: Verify | Assert testuser1 has active NOPASSWD sudo access
      ansible.builtin.assert:
        that:
          - __verify_sudo_list_testuser1.rc == 0
          - "'NOPASSWD' in __verify_sudo_list_testuser1.stdout"
        fail_msg: "testuser1 does not have expected NOPASSWD sudo permissions"
        success_msg: "testuser1 active NOPASSWD sudo permissions verified"
