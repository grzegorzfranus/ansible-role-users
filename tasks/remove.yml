---
# =============================================================================
# Ansible Role: Users - Tasks: Remove
# =============================================================================
# Remove user accounts and groups from the target system.
# =============================================================================

- name: Users | remove | Convert users removal dictionary to list
  ansible.builtin.set_fact:
    __users_remove_list: >-
      {{ __users_remove_list | default([]) + [{'name': username} | combine(user_data if user_data else {})] }}
  loop: "{{ users_remove_dict | dict2items }}"
  vars:
    username: "{{ item.key }}"
    user_data: "{{ item.value }}"
  when: >
    users_remove_dict is defined and users_remove_dict | length > 0

- name: Users | remove | Remove user accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: absent
    remove: "{{ item.remove_home | default(users_remove_home) }}"
    force: "{{ item.force | default(false) }}"
  become: true
  with_items: "{{ __users_remove_list }}"

- name: Users | remove | Remove user groups
  ansible.builtin.group:
    name: "{{ item.group | default(item.name) }}"
    state: absent
  become: true
  with_items: "{{ __users_remove_list }}"
  when: >
    users_create_group | bool

- name: Users | remove | Remove per-user sudoers drop-in files
  ansible.builtin.file:
    path: "{{ users_sudoers_directory }}/{{ users_sudoers_file_prefix }}{{ item.name }}"
    state: absent
  become: true
  loop: "{{ __users_remove_list | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - users_manage_sudoers | bool

# Hand-written rules in the main file survive userdel and would grant a re-created user of the same name
# its old rights; validation keeps a broken file from being written.
- name: Users | remove | Remove removed users' rules from the main sudoers file
  ansible.builtin.lineinfile:
    path: "{{ users_sudoers_main_file }}"
    regexp: "^\\s*{{ item.name | regex_escape }}\\s"
    state: absent
    validate: "visudo -cf %s"
  become: true
  loop: "{{ __users_remove_list | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: users_remove_main_sudoers_rules | bool
