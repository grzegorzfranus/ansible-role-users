---
# =============================================================================
# Ansible Role: Users - Internal Variables
# =============================================================================
# Internal constants and computed values.
# These are NOT user-overridable. All use double-underscore prefix per
# Red Hat CoP — Variable Naming.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. System Paths
# -----------------------------------------------------------------------------
# Base directory for regular user home directories
__users_home_base: "/home"

# Base directory for system user home directories
__users_system_home_base: "/var/lib"

# -----------------------------------------------------------------------------
# 2. Authentication Configuration
# -----------------------------------------------------------------------------
# Path to system-wide PAM configuration directory
__users_pam_config_dir: "/etc/pam.d"

# Path to system-wide login.defs file for shadow password suite
__users_login_defs_path: "/etc/login.defs"

# -----------------------------------------------------------------------------
# 3. Command Settings
# -----------------------------------------------------------------------------
# Command used to set account expiration date
__users_chage_command: "chage"

# Command used to lock user accounts
__users_lock_command: "usermod --lock"

# Command used to unlock user accounts
__users_unlock_command: "usermod --unlock"
